shard-spec: "0.3.0"
id: 1e540354-13a8-40b9-b9d7-70c24b663095
org: nuu-cognition
source:
  id: 0e657579-aef5-43a3-aee2-91010e900afb
version: "0.2.0"
name: Flint
shorthand: f
description: Core agent environment for Flint workspaces. Defines shard rules, template rules, workspace conventions, and note types.

dependencies:
  "@nuu-cognition/invironments": ""

folders:
  - Mesh/Main
  - Mesh/Sections
  - Mesh/Groups

install:
  - source: inst-f-section_new.md
    dest: Mesh/Main/(Section) New/(Section) New.md
    mode: once
  - source: inst-f-section_working.md
    dest: Mesh/Main/(Section) Working/(Section) Working.md
    mode: once
  - source: inst-f-section_consolidated.md
    dest: Mesh/Main/(Section) Consolidated/(Section) Consolidated.md
    mode: once
  - source: inst-f-flint_init.md
    dest: Mesh/(System) Flint Init.md
    mode: once
  - source: otmp-f-default.md
    dest: Shards/(Shards) Obsidian Templates/otmp-f-default.md
    mode: force
